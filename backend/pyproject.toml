[project]
name = "interview-prep-agent-backend"
version = "0.1.0"
description = "FastAPI backend for PrepPilot: syllabus, daily plans, grading, spaced repetition and LLM agents."
requires-python = ">=3.10"
dependencies = [
    # --- Web API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # --- Database ---
    "sqlalchemy>=2.0",
    # --- Syllabus files ---
    "pyyaml>=6.0",
    # --- LLM providers ---
    "anthropic>=0.70",
    "httpx>=0.27",
    # --- Secrets (API keys stored in the OS credential vault) ---
    "keyring>=25.0",
    # --- Notebook PDF export ---
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.uv]
# This is an application, not a library: install its dependencies only.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
